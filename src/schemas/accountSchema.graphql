enum ACCOUNTSTATUS{
    ACTIVE
    INACTIVE
    CLOSED
}
input AccountInput {
    userId: String!
    balance: Money
    status: ACCOUNTSTATUS
    paidMembership: Boolean
    }

type Account {
    id: String!
    userId: String!
    accountNumber: String!
    balance: Money!
    status: ACCOUNTSTATUS!
    paidMembership: Boolean!
    hasLoan: Boolean!
    is_deleted: Boolean
    deleted_at: String
    owner: User
    loans: [Loan]
    transactions: [Transaction]
}

type Query {
    getAccounts: [Account]
    getAccountById(id: String!): Account
}

type Mutation {
    createAccount(account: AccountInput): Account
    updateAccount(
        id: String!
        balance: Money
        status: ACCOUNTSTATUS
        paidMembership: Boolean
    ): Account

    deleteAccount(id: String!): String
}

