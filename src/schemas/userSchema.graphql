enum USERROLE {
    ADMIN
    MANAGER
    USER
}
enum USERSTATUS {
    ACTIVE
    INACTIVE
}
enum GENDER {
    MALE
    FEMALE
}
input UserInput {
    first_name: String!
    last_name: String!
    other_name: String
    email: String!
    password: String
    role: USERROLE!
    status: USERSTATUS!
    contact: String!
    dob: String!
    gender: GENDER
}
input UserUpdateInput {
    first_name: String
    last_name: String
    other_name: String
    email: String
    role: USERROLE
    status: USERSTATUS
    contact: String
    dob: String
    gender: GENDER
}
type User{
    id: ID
    first_name: String
    last_name: String
    other_name: String
    email: String
    role: USERROLE
    status: USERSTATUS
    lastLogin: String
    joinDate: String
    contact: String
    gender: GENDER
    dob: String
    hasAccount: Boolean
    fullName: String
    # Resized JPEG data URL; null means show initials
    avatar: String
    account: Account
    }

# Fields a member may change on their own profile (Settings page); avatar null removes it
input ProfileInput {
    first_name: String
    last_name: String
    other_name: String
    email: String
    contact: String
    dob: String
    gender: GENDER
    avatar: String
}
type Query{
        getUsers: [User]
        getUserById(id: ID!): User
        getHealthCheck: String
        # The signed-in user
        me: User
    }

type AuthPayload {
    token: String
    user: User
    success: Boolean!
    message: String
}

type Mutation {
    createUser(user: UserInput): User
    updateUser(
        id: ID!
        updateData: UserUpdateInput
        )               : User
    deleteUser(id: ID!): String
    # Always updates the signed-in user (id taken from the session, not the request)
    updateMyProfile(input: ProfileInput!): User
    login(email: String!, password: String!): AuthPayload
    logout: Boolean!

}