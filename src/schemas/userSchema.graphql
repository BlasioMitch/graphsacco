enum USERROLE {
    ADMIN
    MANAGER
    USER
}
enum USERSTATUS {
    ACTIVE
    INACTIVE
}
enum GENDER {
    MALE
    FEMALE
}
input UserInput {
    first_name: String!
    last_name: String!
    other_name: String
    email: String!
    password: String
    role: USERROLE!
    status: USERSTATUS!
    contact: String!
    dob: String!
    gender: GENDER
}
input UserUpdateInput {
    first_name: String
    last_name: String
    other_name: String
    email: String
    role: USERROLE
    status: USERSTATUS
    contact: String
    dob: String
    gender: GENDER
}
type User{
    id: ID
    first_name: String
    last_name: String
    other_name: String
    email: String
    role: USERROLE
    status: USERSTATUS
    lastLogin: String
    joinDate: String
    contact: String
    gender: GENDER
    dob: String
    hasAccount: Boolean
    fullName: String
    # Resized JPEG data URL; null means show initials
    avatar: String
    # Member settings (mobile app)
    twoFactorEnabled: Boolean
    notifyTransactions: Boolean
    notifyUpdates: Boolean
    notifyLoanDecisions: Boolean
    # Signed in with a temporary password from staff: must choose a new one first
    mustChangePassword: Boolean
    account: Account
    }

# Settings a member changes from the app (Settings page)
input MySettingsInput {
    twoFactorEnabled: Boolean
    notifyTransactions: Boolean
    notifyUpdates: Boolean
    notifyLoanDecisions: Boolean
}

enum NOTIFICATIONCATEGORY {
    TRANSACTION
    LOAN_DECISION
    UPDATE
    # For ADMIN and MANAGER users, e.g. a password reset to handle
    STAFF_REQUEST
}

# The screen a notification opens
enum NOTIFICATIONTARGET {
    TRANSACTION
    LOAN
    PROFILE
    SECURITY
    PASSWORD_RESET
}

type Notification {
    id: ID!
    category: NOTIFICATIONCATEGORY!
    title: String!
    body: String!
    targetType: NOTIFICATIONTARGET
    targetId: ID
    readAt: String
    createdAt: String!
}

type NotificationFeed {
    items: [Notification!]!
    unreadCount: Int!
}

# Fields a member may change on their own profile (Settings page); avatar null removes it
input ProfileInput {
    first_name: String
    last_name: String
    other_name: String
    email: String
    contact: String
    dob: String
    gender: GENDER
    avatar: String
}
type Query{
        getUsers: [User]
        getUserById(id: ID!): User
        getHealthCheck: String
        # The signed-in user
        me: User
        # The signed-in user's notifications, newest first (unreadOnly: just the ones not read yet)
        myNotifications(limit: Int, unreadOnly: Boolean): NotificationFeed!
    }

type Mutation {
    createUser(user: UserInput): User
    updateUser(
        id: ID!
        updateData: UserUpdateInput
        )               : User
    deleteUser(id: ID!): String
    # Always updates the signed-in user (id taken from the session, not the request)
    updateMyProfile(input: ProfileInput!): User
    updateMySettings(input: MySettingsInput!): User
    # Both require the current password
    changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!
    changeMyEmail(email: String!, password: String!): User
    # Marks the given notifications read, or all when ids is omitted; returns how many changed
    markNotificationsRead(ids: [ID!]): Int!

}